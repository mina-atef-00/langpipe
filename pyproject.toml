[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langpipe"
version = "0.1.0"
description = "A language-agnostic learning pipeline: curriculum, graded practice generation, spaced repetition, and retention analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "langpipe contributors" }]
keywords = ["language-learning", "spaced-repetition", "srs", "anki", "curriculum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "typer==0.27.2",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[project.scripts]
langpipe = "langpipe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/langpipe"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer's default arguments use callables

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/langpipe"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
